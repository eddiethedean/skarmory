[workspace]
members = [
    "crates/analysis_core",
    "crates/python_frontend",
    "crates/cli",
    "crates/python_bindings",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/eddiethedean/skarmory"
publish = false
license = "MIT"

[workspace.dependencies]
skarmory_core = { path = "crates/analysis_core" }
skarmory_python = { path = "crates/python_frontend" }
pyo3 = "=0.29.0"
ruff_python_ast = "=0.0.12"
ruff_python_parser = "=0.0.12"
ruff_text_size = "=0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

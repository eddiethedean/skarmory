name: Build a release wheel

on:
  workflow_call:
    inputs:
      wheel-name:
        required: true
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      manylinux:
        required: true
        type: string
      args:
        required: true
        type: string

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.98.1'
  MATURIN_VERSION: '1.16.0'

jobs:
  wheel:
    name: Build and test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.wheel-name == 'windows-arm64' && '3.14' || '3.11' }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.98.1'
          targets: ${{ inputs.target }}
      - name: Install wheel build tools
        shell: bash
        run: |
          python -m pip install "maturin==$MATURIN_VERSION"
          if [[ "$RUNNER_OS" == Linux ]]; then
            python -m pip install 'ziglang==0.15.2' 'patchelf==0.17.2.4'
          fi
      - name: Build the stable-ABI wheel
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          MANYLINUX: ${{ inputs.manylinux }}
          EXTRA_ARGS: ${{ inputs.args }}
        run: |
          read -r -a args <<< "$EXTRA_ARGS"
          if [[ "$MANYLINUX" != auto && "$MANYLINUX" != off ]]; then
            args+=(--compatibility "manylinux_$MANYLINUX")
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            args+=(--interpreter python)
          fi
          maturin build --release --locked --features pyo3/abi3-py311 \
            --target "$TARGET" --out dist "${args[@]}"
      - name: Test the installed wheel
        if: ${{ !startsWith(inputs.wheel-name, 'musllinux-') }}
        shell: bash
        env:
          SKARMORY_REQUIRE_NATIVE: '1'
          TARGET: ${{ inputs.target }}
        run: |
          interpreter=(python)
          if [[ "$TARGET" == x86_64-apple-darwin ]]; then
            interpreter=(arch -x86_64 "$(command -v python)")
          fi
          "${interpreter[@]}" -m pip install --no-deps dist/*.whl
          "${interpreter[@]}" -m unittest discover -s tests/python -v
      - name: Test the installed wheel on musl
        if: ${{ startsWith(inputs.wheel-name, 'musllinux-') }}
        shell: bash
        run: |
          docker run --rm -e SKARMORY_REQUIRE_NATIVE=1 \
            --mount "type=bind,source=$PWD,target=/project,readonly" -w /project \
            python:3.11-alpine3.22 sh -ec '
              apk add --no-cache git
              python -m pip install --no-deps dist/*.whl
              python -m unittest discover -s tests/python -v
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-python-${{ inputs.wheel-name }}
          path: dist/*.whl
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.98.1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Test the SDK without a native extension
        env:
          PYTHONPATH: python:tests/python
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.loadTestsFromName(
              "test_sdk.SdkTests.test_source_only_scan_raises"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != 1 or result.skipped:
              raise SystemExit("The source-only SDK test must execute and pass")
          PY
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # rust-toolchain action
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Test the dead-code release gate
        run: python -m unittest discover -s tests/conformance -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  preview-scope:
    name: Check compatibility preview scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check changed paths
        id: scope
        run: |
          git rev-parse --verify HEAD^2 > /dev/null
          python3 - <<'PY'
          from fnmatch import fnmatchcase
          import os
          import subprocess

          paths = subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "-z", "HEAD^1", "HEAD",
          ]).split(b"\0")
          patterns = (
              ".github/workflows/ci.yml",
              ".github/workflows/dead-code.yml",
              ".github/workflows/release-wheel.yml",
              "Cargo.lock", "Cargo.toml", "crates/**", "pyproject.toml",
              "python/**", "rust-toolchain.toml", "scripts/check_dead_code_gate.py",
              "scripts/phase03_*.py", "tests/conformance/**",
          )
          required = any(fnmatchcase(os.fsdecode(path), pattern) for path in paths for pattern in patterns)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"required={str(required).lower()}", file=output)
          PY

  preview-wheel:
    name: Build Linux SDK for compatibility
    needs: [preview-scope]
    if: needs.preview-scope.outputs.required == 'true'
    uses: ./.github/workflows/release-wheel.yml
    with:
      wheel-name: manylinux-x86_64
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      manylinux: '2_17'
      args: --zig

  preview-dead-code:
    name: Preview pinned dead-code compatibility
    needs: [preview-wheel]
    uses: ./.github/workflows/dead-code.yml
    with:
      strict: false

  required-rust:
    # Keep the check name configured in the main branch ruleset.
    name: Rust checks
    if: ${{ always() }}
    needs: [rust, preview-scope, preview-dead-code]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Rust checks and applicable compatibility preview
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          SCOPE_RESULT: ${{ needs.preview-scope.result }}
          PREVIEW_REQUIRED: ${{ needs.preview-scope.outputs.required }}
          PREVIEW_RESULT: ${{ needs.preview-dead-code.result }}
        run: |
          if [[ "$RUST_RESULT" != success ]]; then
            echo "Rust lint and tests: $RUST_RESULT" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            exit 0
          fi
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "Compatibility scope check: $SCOPE_RESULT" >&2
            exit 1
          fi
          case "$PREVIEW_REQUIRED:$PREVIEW_RESULT" in
            true:success|false:skipped) ;;
            *)
              echo "Compatibility preview required=$PREVIEW_REQUIRED result=$PREVIEW_RESULT" >&2
              exit 1
              ;;
          esac

  package:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # rust-toolchain action
        with:
          toolchain: "1.98.1"
      - run: python scripts/check_structure.py
      - run: python -m pip install "maturin==1.16.0"
      - name: Build the SDK wheel
        run: maturin build --release --locked --interpreter python --out dist
      - name: Install the separate native CLI
        run: cargo install --locked --path crates/cli --root dist/cli
      - name: Verify the installed distributions
        run: |
          python -c "from pathlib import Path; import subprocess, sys; wheel, = Path('dist').glob('*.whl'); cli, = Path('dist/cli/bin').glob('skarmory*'); subprocess.check_call([sys.executable, 'scripts/check_distributions.py', str(wheel), str(cli), '--combined'])" > dist/distributions.json
      - name: Rebuild and test the SDK wheel from the source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          maturin sdist --out dist
          python -c "from pathlib import Path; import subprocess, sys; source, = Path('dist').glob('*.tar.gz'); subprocess.check_call([sys.executable, '-m', 'pip', 'wheel', '--no-build-isolation', '--no-deps', '--wheel-dir', 'dist/sdist-check', str(source)])"
          python -c "from pathlib import Path; import subprocess, sys; wheel, = Path('dist/sdist-check').glob('*.whl'); subprocess.check_call([sys.executable, 'scripts/check_distributions.py', str(wheel), 'dist/cli/bin/skarmory'])" > dist/sdist-distributions.json
      - name: Upload installed distribution measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase0-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*distributions.json

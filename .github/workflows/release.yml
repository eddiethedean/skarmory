name: Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-wheel.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/*/Cargo.toml'
      - 'pyproject.toml'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'licenses/**'
      - 'scripts/publish_crates.py'
      - 'scripts/update_third_party_notices.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.98.1'
  MATURIN_VERSION: '1.16.0'
  TWINE_VERSION: '6.2.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Check release version
    runs-on: ubuntu-24.04
    outputs:
      dead-code-gate-required: ${{ steps.version.outputs.dead-code-gate-required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Require the Phase 0.3 gate workflow on new tags
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          major, minor, _ = version.split(".", 2)
          gate = Path(".github/workflows/dead-code.yml")
          if (int(major), int(minor)) >= (0, 3) and not gate.is_file():
              raise SystemExit("Phase 0.3 publication requires the pinned dead-code release gate")
          PY
      - run: python scripts/check_structure.py
      - name: Match the tag to the package version
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          expected_tag = f"v{version}"
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != expected_tag:
              raise SystemExit(f"Expected release tag {expected_tag}")
          major, minor, _ = version.split(".", 2)
          gate_required = (int(major), int(minor)) >= (0, 3)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              print(f"dead-code-gate-required={str(gate_required).lower()}", file=outputs)
          print(f"Release version {version}")
          PY

  checks:
    needs: [release-metadata]
    # The regular CI workflow already runs separately for pull requests.
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/ci.yml

  verify-crates:
    name: Verify crate packages
    needs: [release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.98.1'
      - run: python scripts/update_third_party_notices.py --check
      - run: cargo package --workspace --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: release-crates
          path: target/package/*.crate
          if-no-files-found: error

  build-gate-wheel:
    name: Python wheel (manylinux-x86_64)
    needs: [release-metadata]
    uses: ./.github/workflows/release-wheel.yml
    with:
      wheel-name: manylinux-x86_64
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      manylinux: '2_17'
      args: --zig

  build-wheels:
    name: Python wheel (${{ matrix.name }})
    needs: [release-metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
            args: --zig
          - name: musllinux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: auto
            args: --zig --compatibility musllinux_1_2
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: auto
            args: --zig --compatibility musllinux_1_2
          - name: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            manylinux: 'off'
            args: ''
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
            args: ''
          - name: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
            args: ''
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: 'off'
            args: ''
    uses: ./.github/workflows/release-wheel.yml
    with:
      wheel-name: ${{ matrix.name }}
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      manylinux: ${{ matrix.manylinux }}
      args: ${{ matrix.args }}

  build-sdist:
    name: Python source distribution
    needs: [release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.98.1'
      - name: Build and test the source distribution
        env:
          SKARMORY_REQUIRE_NATIVE: '1'
        run: |
          python -m pip install "maturin==$MATURIN_VERSION"
          maturin sdist --out dist
          python -m pip install --no-build-isolation --no-deps dist/*.tar.gz
          python -m unittest discover -s tests/python -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify-python:
    name: Verify Python distributions
    needs: [build-gate-wheel, build-wheels, build-sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-python-*
          path: dist
          merge-multiple: true
      - name: Verify all release files
        run: |
          python - <<'PY'
          from pathlib import Path

          dist = Path("dist")
          wheels = len(list(dist.glob("*.whl")))
          sources = len(list(dist.glob("*.tar.gz")))
          if (wheels, sources) != (8, 1):
              raise SystemExit(f"Expected 8 wheels and 1 source distribution, found {wheels} and {sources}")
          PY
          python -m pip install "twine==$TWINE_VERSION"
          python -m twine check --strict dist/*

  verify-dead-code:
    name: Verify pinned dead-code compatibility
    needs: [release-metadata, build-gate-wheel]
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && needs.release-metadata.outputs.dead-code-gate-required != 'false')
    uses: ./.github/workflows/dead-code.yml
    with:
      strict: ${{ needs.release-metadata.outputs.dead-code-gate-required != 'false' }}

  publish-crates:
    name: Publish to crates.io
    needs: [release-metadata, checks, verify-crates, verify-python, verify-dead-code]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref_type == 'tag'
      && needs.release-metadata.result == 'success'
      && needs.checks.result == 'success'
      && needs.verify-crates.result == 'success'
      && needs.verify-python.result == 'success'
      && (needs.verify-dead-code.result == 'success'
          || (needs.release-metadata.outputs.dead-code-gate-required == 'false'
              && needs.verify-dead-code.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.98.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-crates
          path: release-crates
      - name: Check publish credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          : "${CARGO_REGISTRY_TOKEN:?Set the CARGO_REGISTRY_TOKEN repository secret}"
          : "${TWINE_PASSWORD:?Set the PYPI_API_TOKEN repository secret}"
      - name: Publish the Rust workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python scripts/publish_crates.py release-crates

  publish-python:
    name: Publish to PyPI
    needs: [publish-crates]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-python-*
          path: dist
          merge-multiple: true
      - run: python -m pip install "twine==$TWINE_VERSION"
      - name: Upload the verified wheels and source distribution
        env:
          TWINE_USERNAME: '__token__'
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --repository pypi --non-interactive --skip-existing dist/*
